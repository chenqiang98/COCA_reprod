model:
  large_model:
    name: 'vit_base_patch16_224'
    pretrained: True
    lr: 0.001
  small_model:
    name: 'resnet50'
    pretrained: True
    lr: 0.00025

dataset:
  name: 'ImageNet-C'
  path: './data/ImageNet-C'  # Path to full ImageNet-C
  batch_size: 64
  shuffle: True  # Enable shuffling for better training randomness


coca:
  # Norm layers to adapt (Tent uses BN-only). Set include_layernorm=true to adapt ViT LNs.
  include_batchnorm: true
  include_layernorm: true
  include_groupnorm: false
  include_instancenorm: false

debug: true