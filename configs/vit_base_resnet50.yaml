model:
  large_model:
    name: 'vit_base_patch16_224'
    pretrained: True
    lr: 0.001
  small_model:
    name: 'resnet50'
    pretrained: True
    lr: 0.00025

dataset:
  name: 'ImageNet-C'
  path: './data/ImageNet-C'  # Path to full ImageNet-C
  batch_size: 64

optimizer:
  name: 'SGD'  # Paper uses SGD with momentum 0.9
  # lr configured per model above

coca:
  lambda_co_adaptation: 1.0
  lambda_self_adaptation: 1.0 
  # Norm layers to adapt (Tent uses BN-only). Set include_layernorm=true to adapt ViT LNs.
  include_batchnorm: true
  include_layernorm: true
  include_groupnorm: false
  include_instancenorm: false