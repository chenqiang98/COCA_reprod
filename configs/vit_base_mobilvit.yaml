model:
  large_model:
    name: 'vit_base_patch16_224'
    pretrained: True
    lr: 0.001
  small_model:
    name: 'mobilevit_s'
    pretrained: True
    lr: 0.001

dataset:
  name: 'ImageNet-C'
  path: './data/ImageNet-C'
  batch_size: 64
  # 64 in RTX 4080 Super(16GB) will cause OOM
  n_examples: 5000

coca:
  # Norm layers to adapt (Tent uses BN-only). Set include_layernorm=true to adapt ViT LNs.
  include_batchnorm: true
  include_layernorm: true
  include_groupnorm: false
  include_instancenorm: false 